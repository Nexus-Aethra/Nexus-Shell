# dshell bundle patch — applied on top of the dsh `web` profile.
# Run with: dsh web --patch ./packages/dshell/bundle/cordis.patch.yml
#
# Each dshell-* package below is a Cordis row the bundle brings into the
# active composition. The web profile is the dsh-web-app bundle; this
# patch layer sits above it, so rows here override base/web by id.
#
# This file is the single install point for dshell: enabling dshell in a
# dsh deployment means adding one --patch flag with this file's path.

# ── host half: terminal capability ─────────────────────────────────────
# dsh ships the `web` profile with bash + sandbox already configured,
# so dshell reuses the existing terminal/sandbox rows and only inserts
# its own plugin packages. Each dshell-* row uses a fresh id so it does
# not collide with a shipped tooling id.

- insert:
    # PTY service + bash backend; these ids are distinct from any
    # shipped web-profile row, so they coexist with the existing tools.
    - id: dshell-terminal
      name: '@deepseek-ai/dsh-terminal'

    - id: dshell-terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      # Since the raw-pty canvas (roadmap Phase 5) the main shells no
      # longer run through this row — it backs the agent's terminal_send
      # sessions. The tuned settle (~350ms instead of dsh's 3s
      # inferred_idle) keeps back-to-back agent tool calls from crawling.
      config:
        idleSilenceMs: 300
        handoffGraceMs: 50

    - id: dshell-tool-terminal
      name: '@deepseek-ai/dsh-tool-terminal'

    # Browser half of the `terminal` Conversation target.
    - id: dshell-conversation
      name: '@deepseek-ai/dsh-dshell-conversation'

    # Browser↔host PTY wire bridge.
    - id: dshell-terminal-bridge
      name: '@deepseek-ai/dsh-dshell-terminal-bridge'

    # Composer mode toggle and prefix handling.
    - id: dshell-mode
      name: '@deepseek-ai/dsh-dshell-mode'

    # /clear, /new, /compact, plus dshell_get_main_terminal model tool.
    - id: dshell-commands
      name: '@deepseek-ai/dsh-dshell-commands'

    # Workspace removal (design 4.7): stub providers for the disabled
    # stock rows below, plus the flat session list for the sidebar.
    - id: dshell-workspace
      name: '@deepseek-ai/dsh-dshell-workspace'

    # SSH devices: durable device/key registry, per-session assignment, and
    # routing of a bound session's shell commands to that device.
    - id: dshell-ssh
      name: '@deepseek-ai/dsh-dshell-ssh'

    # Cross-session pipe: user-established links between sessions, deferred
    # requests one agent hands to another, scoped revocable folder grants, and
    # the watchdog that guarantees the requester is always woken.
    - id: dshell-buffer
      name: '@deepseek-ai/dsh-dshell-buffer'

    # Right-sidebar file navigator: takes over the `files` tab kind (dsh's
    # registry keeps one builtin and one extension per kind, and the extension
    # is the one in force) so the pane can walk — `..`, clickable crumbs,
    # back/forward — through the session's own execution world.
    - id: dshell-files
      name: '@deepseek-ai/dsh-dshell-files'

# ── workspace removal (design 4.7) ────────────────────────────────────
# dshell has no use for dsh's directory-workspace grouping: a terminal's
# workspace is its current directory. The four stock web-app rows are
# disabled here and dshell-workspace provides same-key stand-ins
# (host `workspaceRegistry`, client `workspaces` + `uiWorkspace` + root
# hook) so session-controller and ui-conversation/ui-sidebar still resolve.
# Sessions are created by cwd instead; see docs/dshell-design.md § 4.7.
# The filesystem provider is dshell's own. `ctx.fs` has exactly one provider,
# and dshell's takes the stock backend's place (extending it) so a session
# bound to a device has its file operations — read, write, edit, list — run on
# that device instead of this machine. The local half of every call is the
# stock implementation verbatim; see packages/dshell/ssh/src/fs-routing.ts.
- id: fs-sandbox
  disabled: true

- id: workspace
  disabled: true
- id: workspace-controller
  disabled: true
- id: directory-picker
  disabled: true
- id: ui-workspace
  disabled: true

# ── the view tab strip ─────────────────────────────────────────────────
# dsh shows the conversation view tabs as soon as more than one view is
# registered, and it builds that list from the RAW slot entries rather than
# the shadowed ones — so a shadowing registration appears as a second tab
# instead of replacing the first. dshell's block view already shadows
# `ui-chat`'s `chat` entry for rendering; disabling the stock row is what
# stops it from also contributing a duplicate tab, leaving the strip with
# exactly two: `会话` (dshell's block view) and `轨迹` (ui-trajectory).
#
# The two child slots ui-chat declared go with it: `conversation.chat.node`
# and `conversation.message.images`. Nothing is lost — dshell's view renders
# neither, so `ui-goal`, `ui-workflow-run` and `ui-attachment` simply never
# get asked to draw into them (the `slots.inject` wait for a declaration that
# never arrives, which is silent by design).
- id: ui-chat
  disabled: true

# ── default agent preset ────────────────────────────────────────────────────
# New sessions follow the dshell preset (installed into the user preset root
# by scripts/install-into-dsh-profile.sh) unless the user picks another in the
# new-session dialog. The dshell preset keeps standard's full tool surface and
# runs every shell command in the agent's own watched terminal: the persistent
# bash spawns through dshell's `dshell-pty` backend, the bridge claims it as
# the agent shell, and the status card shows it live. The `standard` preset
# remains selectable; only the follow-default changes.
- id: agent-presets
  config:
    default: dshell

# ── dev-only hot reload (skip in non-dev sessions) ─────────────────────
# dsh's web profile mounts @deepseek-ai/dsh-client-hmr as a client
# roster row that stays idle until a `pnpm run dev:web` rebuild watcher
# rewrites client bundles. The row stays in the roster even when no
# watcher runs, which makes the client bundle loader look up `/plugins/
# ...dsh-client-hmr/client.js` at boot; without a rebuild watcher the
# file may not exist, blocking the entire client bundle. Disabling the
# row by re-asserting it with `disabled: true` removes it from the
# client roster without touching dsh source.
- id: client-hmr
  disabled: true